; HAIL-E camera firmware - Seeed XIAO ESP32-S3 Sense (camera + mic expansion board)
; Build:  pio run          Flash:  pio run -t upload       Console:  pio device monitor
;
; Same platform as firmware-face (pioarduino, Arduino core 3.3.11). Every
; download comes from GitHub, so it builds where the PlatformIO registry is
; unreachable.

[env:camera]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

board_build.arduino.memory_type = qio_opi      ; ESP32-S3R8: 8 MB octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/links2004/arduinoWebSockets.git#2.7.2
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
