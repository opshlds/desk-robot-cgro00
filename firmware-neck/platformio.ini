; HAIL-E neck firmware - ESP32-C3 dev board driving two hobby servos (pan + tilt)
; Build:  pio run          Flash:  pio run -t upload       Console:  pio device monitor
;
; Same platform as firmware-face / firmware-camera (pioarduino, Arduino core
; 3.3.11). Every download comes from GitHub, so it builds where the
; PlatformIO registry is unreachable.
;
; esp32-c3-devkitm-1 fits most C3 boards (DevKitM-1, SuperMini, ...): 4 MB
; flash, DIO. The console runs on the native USB port AND on UART0 (GPIO20/21,
; the USB-serial chip on boards that have one), whichever you plug into.

[env:neck]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv       ; one 3 MB app, no OTA (updates go over USB)

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/links2004/arduinoWebSockets.git#2.7.2
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
