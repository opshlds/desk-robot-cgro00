; HAIL-E neck firmware - ESP32-C3 dev board driving two hobby servos (pan + tilt)
; Build:  pio run          Flash:  pio run -t upload       Console:  pio device monitor
;
; Same platform as firmware-face / firmware-camera (pioarduino, Arduino core
; 3.3.11). Every download comes from GitHub, so it builds where the
; PlatformIO registry is unreachable.
;
; esp32-c3-devkitm-1 fits most C3 boards (DevKitM-1, SuperMini, ...): 4 MB
; flash, DIO. The console runs on the native USB port AND on UART0 (GPIO20/21,
; the USB-serial chip on boards that have one), whichever you plug into.

[platformio]
default_envs = neck

[env:neck]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

board_build.flash_mode = dio
board_upload.flash_size = 4MB
; Two 1.875 MB app slots for OTA (the app is ~1.2 MB). NVS at 0x9000 and
; otadata at 0xe000 are where huge_app.csv (0.1.0) had them, so moving from
; 0.1.0 = partitions + boot_app0 + app, and the settings survive (README).
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/links2004/arduinoWebSockets.git#2.7.2
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3

; OTA test builds (same source): a trivial version bump to install over the
; air, and a build that can never reach the brain, to prove the rollback.
;   pio run -e neck_bump        pio run -e neck_rbtest
[env:neck_bump]
extends = env:neck
build_flags = ${env:neck.build_flags} -DNECK_FW_VERSION=\"0.1.2\" '-DFW_NOTE="OTA test build 0.1.2: installed over the air"'

[env:neck_rbtest]
extends = env:neck
build_flags = ${env:neck.build_flags} -DNECK_FW_VERSION=\"0.1.3-rbtest\" -DOTA_TEST_NO_BRAIN '-DFW_NOTE="ROLLBACK TEST 0.1.3-rbtest: never reaches the brain, rolls back after 60 s"'
