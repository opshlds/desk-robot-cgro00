; HAIL-E face firmware - Waveshare ESP32-S3-Touch-AMOLED-1.43
; Build:  pio run          Flash:  pio run -t upload       Console:  pio device monitor
;
; pioarduino = PlatformIO platform for the Arduino-ESP32 3.x core (Waveshare's
; demos need core >= 3.0). Every download here comes from GitHub, so this also
; builds where the PlatformIO registry is unreachable.

[platformio]
default_envs = face

[env:face]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi      ; ESP32-S3R8: 8 MB octal PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/lvgl/lvgl.git#v8.4.0
    https://github.com/moononournation/Arduino_GFX.git#v1.6.8
    https://github.com/links2004/arduinoWebSockets.git#2.7.2
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3

; OTA test builds (same source): a trivial version bump to install over the
; air, and a build that can never reach the brain, to prove the rollback.
;   pio run -e face_bump        pio run -e face_rbtest
[env:face_bump]
extends = env:face
build_flags = ${env:face.build_flags} -DFACE_FW_VERSION=\"0.4.1\" '-DFW_NOTE="OTA test build 0.4.1: installed over the air"'

[env:face_rbtest]
extends = env:face
build_flags = ${env:face.build_flags} -DFACE_FW_VERSION=\"0.4.2-rbtest\" -DOTA_TEST_NO_BRAIN '-DFW_NOTE="ROLLBACK TEST 0.4.2-rbtest: never reaches the brain, rolls back after 60 s"'
